name: Daily Bellhaven sync

on:
  schedule:
    - cron: "0 6 * * *"      # every day at 06:00 UTC
  workflow_dispatch:          # lets you also run it by hand

jobs:
  propose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      # Keep the decision memory between daily runs so decided items are never re-proposed
      - uses: actions/cache@v4
        with:
          path: proposals.db
          key: proposals-db-${{ github.run_id }}
          restore-keys: proposals-db-

      # Scrape, match, and save NEW proposals only. Nothing writes to the CRM here.
      - run: python run_pipeline.py
        env:
          BELLHAVEN_TOKEN: ${{ secrets.BELLHAVEN_TOKEN }}